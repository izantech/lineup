acceptance_criteria:
  - criterion: Task graph is deterministic
  - criterion: Implement and verify succeed under native mode
risks:
  - risk: Fallback mode could drift from native artifact contracts
    mitigation: Compare shared plan/tasks artifacts in the regression harness

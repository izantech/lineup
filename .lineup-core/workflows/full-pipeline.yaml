apiVersion: lineup/v3
kind: Workflow
name: full-pipeline
description: |
  Standard pipeline for complex multi-file changes with unclear requirements.

variables:
  - name: target_scope
    description: "Which area of the codebase to focus on"
    type: string
    default: ""
    required: false

stages:
  - id: triage
    type: builtin
    description: "Classify complexity and identify affected areas"
    outputs:
      complexity:
        type: enum
        values: [simple, moderate, complex]
      affected_areas:
        type: list
        items:
          type: object
          properties:
            name: { type: string }
            coupled: { type: boolean }
      search_targets:
        type: list
        items:
          type: object
          properties:
            area: { type: string }
            targets: { type: list, items: { type: string } }
      independent_areas:
        type: list
        items:
          type: list
          items: { type: string }

  - id: clarify
    type: reasoning
    description: "Refine requirements with structured questions"
    depends_on: [triage]
    inputs:
      - source: triage
        fields: [complexity, affected_areas]
    outputs:
      requirements: { type: string }
    optional: true
    condition: "{{ stages.triage.outputs.complexity }} != simple"
    gate: false

  - id: research
    type: agent
    agent: researcher
    description: "Explore codebase and gather context"
    depends_on: [triage, clarify]
    inputs:
      - source: triage
        fields: [search_targets, affected_areas]
      - source: clarify
        fields: [requirements]
        fallback: "Original user request"
    outputs:
      what_found: { type: object }
      how_it_works: { type: string, max_length: 500 }
      constraints: { type: object }
      gaps: { type: object }
    parallel:
      strategy: per-area
      max: 3
    timeout: 5m
    retry:
      max_attempts: 1
      on: [timeout, rate_limit]

  - id: gate
    type: reasoning
    description: "Review research and resolve remaining ambiguities"
    depends_on: [research]
    inputs:
      - source: research
        fields: [what_found, constraints, gaps]
    outputs:
      resolved_requirements: { type: string }
    skip_if: "{{ stages.research.outputs.gaps | length }} == 0"

  - id: plan
    type: agent
    agent: architect
    depends_on: [gate, triage]
    inputs:
      - source: triage
        fields: [complexity, independent_areas]
      - source: gate
        fields: [resolved_requirements]
      - source: research
        fields: [what_found, constraints]
        via: file-reference
    outputs:
      summary: { type: string }
      approaches: { type: list }
      changes: { type: list }
      parallelization_strategy: { type: object }
      acceptance_criteria: { type: list }
    parallel:
      strategy: per-area
      condition: "{{ stages.triage.outputs.independent_areas | length }} > 1"
    conditional_approach:
      simple: 1
      default: 3

  - id: plan-approval
    type: approval
    depends_on: [plan]
    inputs:
      - source: plan
        fields: [summary, approaches, changes, parallelization_strategy]

  - id: implement
    type: agent
    agent: developer
    depends_on: [plan-approval]
    inputs:
      - source: plan
        fields: [changes, parallelization_strategy, acceptance_criteria]
    outputs:
      changes_made: { type: list }
      issues_encountered: { type: list }
    retry:
      max_attempts: 2
      on: [build_failure, test_failure]
    on_failure:
      action: report
      block_dependents: true

  - id: verify
    type: agent
    agent: reviewer
    depends_on: [implement]
    inputs:
      - source: plan
        fields: [acceptance_criteria]
      - source: implement
        fields: [changes_made]
        via: file-reference
    outputs:
      status: { type: enum, values: [PASS, FAIL, PASS_WITH_WARNINGS] }
      issues: { type: list }
    on_failure:
      action: retry-from
      stage: implement
      max_retries: 2

  - id: document
    type: agent
    agent: documenter
    depends_on: [verify]
    condition: "{{ stages.verify.outputs.status }} != FAIL"
    inputs:
      - source: plan
        fields: [summary, changes]
      - source: implement
        fields: [changes_made]
    optional: true
    gate: approval
    outputs:
      documents:
        type: list
        items:
          type: string
      report:
        type: object

snapshots:
  max_size: 2KB
  overflow: file-reference
  stream_threshold: 500B
  compression: hybrid

cache:
  dir: .lineup/.cache/
  key: "{{ variables.task_prompt }}+{{ stages.triage.outputs_hash }}"
  format: yaml

lifecycle:
  ephemeral_dir: .lineup/.ephemeral/
  cleanup: after_verify
  persist:
    - implement (code changes)
    - document (documentation files)

name: CLI Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Validate tag/version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./cli/package.json').version")"

          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag/version mismatch: tag=$TAG package=$PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm --prefix cli ci

      - name: Build
        run: npm --prefix cli run build

      - name: Dist smoke
        run: npm --prefix cli run smoke:dist

      - name: Publish to npm
        run: npm publish --prefix cli --access public --provenance

deliverables:
  - Add lineup approve <run-id> command marking a pending plan as approved
  - Add lineup pending command listing runs awaiting approval
  - Add retry-failed-wave semantics to lineup resume
  - Add --skip-task <id> flag to lineup resume for bypassing blocked tasks
  - Record approval state and approver metadata in pipeline state
acceptance_criteria:
  - lineup approve transitions a blocked run to ready-to-continue
  - lineup pending lists all runs with status blocked awaiting approval
  - Retry resumes from the exact failed wave without re-executing succeeded tasks
  - Skip marks the task as skipped and continues the wave
  - Approval metadata is persisted in state.json
notes:
  determinism_rules:

# bug-triage -- Investigate and fix a reported bug.
# Starts with research to understand the bug's context and reproduce it,
# then plans and implements the fix with targeted verification.

name: bug-triage
description: |
  Investigate and fix a reported bug. Researches the affected code path,
  plans a minimal fix, implements it, and verifies the fix with a regression test.

variables:
  - name: bug_description
    description: "Description of the bug or link to the issue"
    default: ""

stages:
  - type: research
    agent: researcher
    prompt: |
      Investigate the reported bug: ${bug_description}

      Find the affected code path, identify the root cause, check for related
      issues in the same area, and look for existing tests that should have
      caught this. Document the reproduction steps if possible.
  - type: plan
    agent: architect
    prompt: |
      Plan a minimal fix for the bug. The fix should:
      1. Address the root cause, not just the symptom
      2. Include a regression test that would have caught the original bug
      3. Avoid unnecessary changes outside the affected code path
  - type: implement
    agent: developer
  - type: verify
    agent: reviewer
    prompt: |
      Verify the bug fix: run the test suite, confirm the new regression test
      passes, and check that the fix does not introduce side effects.

verification:
  - "Root cause is addressed, not just the symptom"
  - "Regression test exists and catches the original bug"
  - "No existing tests are broken"
  - "Fix is minimal and scoped to the affected code path"
